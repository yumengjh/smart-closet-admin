name: Management frontend checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install security tools
        run: |
          bash scripts/ci/install-security-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test scan failure handling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci/tests
      - name: Scan locked dependencies, history and source
        run: |
          mkdir -p security-reports
          git rev-parse HEAD > security-reports/commit.txt
          bash scripts/ci/security-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-security-reports
          path: security-reports
          retention-days: 30
      - run: pnpm install --frozen-lockfile
      - name: Contract tests
        run: node --test scripts/*.test.mjs
      - run: pnpm run typecheck
      - run: pnpm run build

# Semaphore: everyday checks, and the site deployment of a version tag (docs/semaphore-deploy.md).
#
#   push a branch  -> checks (typecheck, build)
#   push a tag vX.Y.Z -> checks, then deploy.yml automatically: build and replace the 1Panel site over SSH
#   Promote "Deploy this commit" by hand -> deploy.yml for any checked commit
version: v1.0
name: Checks
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

# A newer push replaces the running check on a branch; main and tags always finish.
auto_cancel:
  running:
    when: "branch != 'main' AND tag !~ '.*'"
  queued:
    when: "branch != 'main' AND tag !~ '.*'"

execution_time_limit:
  minutes: 20

blocks:
  - name: Verify
    task:
      jobs:
        - name: typecheck, build
          commands:
            - checkout
            - sem-version node 22
            - corepack enable
            - cache restore pnpm-$(checksum pnpm-lock.yaml)
            - pnpm install --frozen-lockfile
            - cache store pnpm-$(checksum pnpm-lock.yaml) ~/.local/share/pnpm/store
            - pnpm typecheck
            - pnpm build

promotions:
  - name: Deploy this commit
    pipeline_file: deploy.yml
    auto_promote:
      when: "result = 'passed' AND tag =~ '^v[0-9]+\\.[0-9]+\\.[0-9]+$'"
